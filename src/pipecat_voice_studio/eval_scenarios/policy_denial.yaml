name: policy-denial
turns:
  - user: "Book a 30-minute appointment for Katherine Johnson about onboarding at 2030-01-02T11:00:00+05:30."
    expect:
      - event: function_call
        calls:
          - name: check_availability
  - user: "No. I do not confirm and I do not authorize creating the appointment."
    expect:
      - event: function_call
        calls:
          - name: confirm_appointment
            args:
              confirmed: false
