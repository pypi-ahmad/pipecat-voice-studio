[build-system]
requires = ["uv_build>=0.8.15,<0.9"]
build-backend = "uv_build"

[project]
name = "pipecat-voice-studio"
version = "0.1.0"
description = "Streamlit studio for building real-time voice and multimodal agents with Pipecat"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.141.1",
    "pipecat-ai==1.7.0",
    "pydantic-settings>=2.15.0",
    "streamlit==1.62.0",
    "torch==2.13.0+cu132",
    "torchvision==0.28.0+cu132",
    "uvicorn>=0.52.4",
]

[tool.uv.build-backend]
module-name = "pipecat_voice_studio"

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    "ty>=0.0.74",
]

[tool.pytest.ini_options]
addopts = "--cov=pipecat_voice_studio --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D", "ISC001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.terminal]
error-on-warning = true

[tool.coverage.run]
omit = ["src/pipecat_voice_studio/ui/*"]
