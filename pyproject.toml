[build-system]
requires = ["uv_build>=0.8.15,<0.9"]
build-backend = "uv_build"

[project]
name = "pipecat-voice-studio"
version = "0.1.0"
description = "Streamlit studio for building real-time voice and multimodal agents with Pipecat"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.141.1",
    "pipecat-ai[cli,evals,runner,webrtc]==1.7.0",
    "pydantic-settings>=2.15.0",
    "streamlit==1.62.0",
    "torch==2.13.0+cu132",
    "torchvision==0.28.0+cu132",
    "uvicorn>=0.52.4",
]

[tool.uv.build-backend]
module-name = "pipecat_voice_studio"

[tool.uv]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.streamlit.component.components]]
name = "studio_graph"
asset_dir = "src/pipecat_voice_studio/ui/frontend/build"

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    "ty>=0.0.74",
]

[tool.pytest.ini_options]
addopts = "--cov=pipecat_voice_studio --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
markers = ["live_eval: runs paid Pipecat evaluations against configured models"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D", "ISC001"]

[tool.ruff.lint.per-file-ignores]
"src/pipecat_voice_studio/graph.py" = ["C901", "EM101", "PLR0912", "PLR0915", "TRY003"]
"src/pipecat_voice_studio/appointments.py" = ["EM101", "PLR0913", "TRY003"]
"src/pipecat_voice_studio/storage.py" = ["EM101", "TRY003"]
"src/pipecat_voice_studio/voice/bot.py" = ["ANN401"]
"src/pipecat_voice_studio/voice/appointment_flow.py" = ["FBT001"]
"src/pipecat_voice_studio/evaluations.py" = ["BLE001", "TRY003"]
"src/pipecat_voice_studio/voice/timeline.py" = ["C901"]
"tests/test_evaluations.py" = ["SLF001"]
"tests/**" = ["PLR2004", "PT018", "S101", "TC003"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.terminal]
error-on-warning = true

[tool.coverage.run]
omit = ["src/pipecat_voice_studio/ui/*", "src/pipecat_voice_studio/voice/*"]
